name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already includes the Android SDK (ANDROID_HOME).
      # android-actions/setup-android@v3 fails here ("Failed to find package
      # 'tools'"), so skip it and just accept the licenses so Gradle can
      # download any extra SDK/NDK pieces it needs.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # `--non-interactive` is not a valid expo flag; CI=1 (set above) is what
      # disables prompts.
      - name: Generate Android project
        run: pnpm --filter @workspace/fuji-recipe-camera exec expo prebuild --platform android --no-install

      # The default 2 GB Gradle heap runs out of memory on the runner when
      # building 4 CPU architectures. Give it more and build arm64 only
      # (all modern phones).
      - name: Tune Gradle for CI
        working-directory: artifacts/fuji-recipe-camera/android
        run: |
          sed -i '/^org.gradle.jvmargs=/d; /^reactNativeArchitectures=/d' gradle.properties
          # The generated file has no trailing newline, so start on a new line;
          # otherwise our first setting gets glued onto the previous property
          # and breaks Expo's autolinking.
          {
            echo ''
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError'
            echo 'reactNativeArchitectures=arm64-v8a'
          } >> gradle.properties

      # A debug build does NOT bundle the JavaScript, so the installed app would
      # only show a "Unable to load script" error. The release variant bundles
      # the JS and is signed with the template's debug keystore, so it installs
      # directly on a phone.
      - name: Build installable APK
        working-directory: artifacts/fuji-recipe-camera/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fuji-Recipe-Camera-APK
          path: artifacts/fuji-recipe-camera/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
