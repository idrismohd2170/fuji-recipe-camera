kind = "mobile"
previewPath = "/"
title = "Fuji Recipe Camera"
description = "A mobile camera app for Galaxy S24 Ultra users to browse Fujifilm-inspired film recipes, preview a selected look while composing, and capture photos with that recipe applied."
version = "1.0.0"
id = "artifacts/fuji-recipe-camera"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20723

[services.development]
run = "pnpm --filter @workspace/fuji-recipe-camera run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fuji-recipe-camera", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fuji-recipe-camera", "run", "serve" ]

[services.env]
PORT = "20723"
BASE_PATH = "/"
